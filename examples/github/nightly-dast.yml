# Nightly DAST on the latest release build; never fails the build, posts nothing.
name: Nandee nightly DAST
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the latest release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern '*.apk' --output app.apk
      - uses: nandee-ai/scan-action@v1
        with:
          api_key: ${{ secrets.NANDEE_API_KEY }}
          project_id: acme/android-app
          scan_types: dast
          artifact_path: app.apk
          fail_on_severity: none
          timeout_minutes: 120
