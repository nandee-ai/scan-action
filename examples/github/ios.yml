# iOS app: SAST + SCA from source, DAST on an unsigned simulator-free IPA built on a macOS runner.
name: Nandee security scan
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build an unsigned IPA
        run: |
          xcodebuild -scheme App -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr App.ipa Payload
      - uses: nandee-ai/scan-action@v1
        with:
          api_key: ${{ secrets.NANDEE_API_KEY }}
          project_id: acme/ios-app
          platform: ios
          scan_types: sast,sca,dast
          artifact_path: App.ipa
