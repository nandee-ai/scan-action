# Pipeline of the gitlab.com/nandee-ai/scan project (assembled and pushed by
# the GitHub release workflow). It publishes the tagged version to the CI/CD
# Catalog and runs the component against itself as a smoke test.
stages: [test, release]

include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/scan@$CI_COMMIT_SHA
    inputs:
      project_id: nandee-ai/scan-selftest
      scan_types: dast
      artifact_path: selftest/empty.apk
      fail_mode: open
      fail_on_severity: none
      allow_failure: true

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script: echo "Releasing $CI_COMMIT_TAG to the CI/CD Catalog"
  rules:
    - if: $CI_COMMIT_TAG
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Nandee-AI Mobile Application Security Scan $CI_COMMIT_TAG. Changelog: https://github.com/nandee-ai/scan-action/blob/main/CHANGELOG.md"
