# Nandee-AI Mobile Application Security Scan: GitLab CI/CD component.
#
#   include:
#     - component: gitlab.com/nandee-ai/scan/scan@1.0.0
#       inputs:
#         project_id: acme/app
#
# The API key is NOT an input: add a masked, protected CI/CD variable named
# NANDEE_API_KEY (Settings → CI/CD → Variables).  Inputs are mapped onto
# NANDEE_* environment variables; the runner never interpolates them into
# a shell.  See README.md for the security model.
spec:
  inputs:
    stage:
      description: "Pipeline stage for the scan job."
      default: test
    job_name:
      description: "Name of the scan job."
      default: nandee-scan
    image:
      description: "Runner image. Pin by digest in production: ghcr.io/nandee-ai/scan@sha256:…"
      default: "ghcr.io/nandee-ai/scan:1"
    project_id:
      description: "Project name shown in Nandee (today: the scan's project title)."
    api_url:
      description: "Nandee API base URL (https only)."
      default: "https://app.nandee.ai"
    scan_types:
      description: "Comma-separated: dast, sast, sca. dast scans the built artifact (artifact_path). sast/sca need a github.com repository today (see README: GitLab-hosted source)."
      default: "dast"
    source_path:
      description: "Directory to detect the platform from, relative to the project directory."
      default: "."
    artifact_path:
      description: "Built APK, AAB or IPA, relative to the project directory (a job artifact from your build stage). Required for dast."
    platform:
      description: "auto, android, ios, react-native or flutter."
      default: auto
      options: [auto, android, ios, react-native, flutter]
    fail_on_severity:
      description: "Fail the job on findings at or above this severity; none never fails."
      default: high
      options: [critical, high, medium, low, none]
    fail_mode:
      description: "closed: a Nandee outage or timeout fails the job. open: the job passes with passed=unknown."
      default: closed
      options: [closed, open]
    ai_triage:
      description: "Only findings Nandee's AI triage did not mark as false positives count toward the gate."
      default: "true"
      options: ["true", "false"]
    wait_for_completion:
      description: "Wait for the scan to finish. false starts it and returns."
      default: "true"
      options: ["true", "false"]
    timeout_minutes:
      description: "How long to wait for the scan (1-180)."
      default: "30"
    green_agent:
      description: "off, comment (patches in the MR note) or merge-request (a separate draft MR; needs NANDEE_GITLAB_TOKEN)."
      default: "off"
      options: ["off", comment, merge-request]
    baseline_mode:
      description: "Only findings new relative to the target branch fail the gate. Empty = true on merge requests."
      default: ""
    comment_detail:
      description: "auto (counts only on public projects), counts, or full."
      default: auto
      options: [auto, counts, full]
    extra_allowed_hosts:
      description: "Comma-separated extra hosts the runner may contact (self-hosted storage). Supports *.suffix."
      default: ""
    scan_fork_mrs:
      description: "Scan merge requests from forks. Off by default: read the README section on forks before enabling."
      default: "false"
      options: ["true", "false"]
    allow_failure:
      description: "Let the pipeline continue when the gate fails (the job still shows as failed)."
      default: false
      type: boolean
    output_dir:
      description: "Where reports are written, relative to the project directory."
      default: "."

"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.image ]]
    entrypoint: [""]
  variables:
    GIT_DEPTH: "50"
    NANDEE_PROJECT_ID: $[[ inputs.project_id ]]
    NANDEE_API_URL: $[[ inputs.api_url ]]
    NANDEE_SCAN_TYPES: $[[ inputs.scan_types ]]
    NANDEE_SOURCE_PATH: $[[ inputs.source_path ]]
    NANDEE_ARTIFACT_PATH: $[[ inputs.artifact_path ]]
    NANDEE_PLATFORM: $[[ inputs.platform ]]
    NANDEE_FAIL_ON_SEVERITY: $[[ inputs.fail_on_severity ]]
    NANDEE_FAIL_MODE: $[[ inputs.fail_mode ]]
    NANDEE_AI_TRIAGE: $[[ inputs.ai_triage ]]
    NANDEE_WAIT_FOR_COMPLETION: $[[ inputs.wait_for_completion ]]
    NANDEE_TIMEOUT_MINUTES: $[[ inputs.timeout_minutes ]]
    NANDEE_GREEN_AGENT: $[[ inputs.green_agent ]]
    NANDEE_BASELINE_MODE: $[[ inputs.baseline_mode ]]
    NANDEE_COMMENT_DETAIL: $[[ inputs.comment_detail ]]
    NANDEE_EXTRA_ALLOWED_HOSTS: $[[ inputs.extra_allowed_hosts ]]
    NANDEE_SCAN_FORK_MRS: $[[ inputs.scan_fork_mrs ]]
    NANDEE_OUTPUT_DIR: $[[ inputs.output_dir ]]
  # Inputs reach the runner only as environment variables: the script is fixed.
  script:
    - /nodejs/bin/node /app/index.js
  allow_failure: $[[ inputs.allow_failure ]]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      sast: $[[ inputs.output_dir ]]/gl-sast-report.json
      dependency_scanning: $[[ inputs.output_dir ]]/gl-dependency-scanning-report.json
      dotenv: $[[ inputs.output_dir ]]/nandee.env
    paths:
      - $[[ inputs.output_dir ]]/nandee-summary.md
      - $[[ inputs.output_dir ]]/nandee.sarif
