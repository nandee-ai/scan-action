# Lint, typecheck, test, rebuild dist/ and compare (T-14), policy checks (T-53,
# T-50), build and smoke-test both runner images (T-52).
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: dist/ matches the source (T-14)
        run: npm run check-dist
      - name: action.yml inputs match the core's input keys
        run: node scripts/check-action-inputs.mjs

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target: [distroless, with-git]
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: gitlab/Dockerfile
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: nandee-scan:${{ matrix.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (non-root, no key → exit 2, fork MR → exit 0)
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/smoke-image.sh "nandee-scan:$TARGET"
      - name: Scan the image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nandee-scan:${{ matrix.target }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
